name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 授予 GITHUB_TOKEN 发布 Pages 所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 不显式指定 version，由 package.json 的 packageManager 字段决定（唯一事实源），
      # 否则与 packageManager pin 冲突会导致 "Multiple versions of pnpm specified" 报错
      # v6 起运行于 Node 24 runtime，消除 Node 20 deprecation 警告
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 类型检查门禁：tsc --noEmit，与 AGENTS.md 质量门禁序列一致（类型检查 → Lint → 测试 → 构建）
      - name: Typecheck
        run: pnpm typecheck

      # Lint 门禁：模块隔离（no-restricted-imports）与禁 any（no-explicit-any）
      - name: Lint
        run: pnpm lint

      # 测试门禁：persist 迁移、i18n 双语对称等回归测试必须通过才允许构建部署
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # P2-03: 构建体积门禁 - 防止首屏 JS 回潮（1.1MB/38 preload chunks）
      - name: Bundle Size Check
        run: pnpm run size:check

      # SPA 路由回退：将 index.html 复制为 404.html，
      # 这样在 GitHub Pages 上刷新 /dezhou/xxx 深层路由不会 404
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
