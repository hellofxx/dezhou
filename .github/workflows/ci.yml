name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

# 最小权限：CI 只读仓库，不发布 Pages
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 不显式指定 version，由 package.json 的 packageManager 字段决定（唯一事实源）
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 与本地 pnpm verify 同序列：typecheck → lint → repo:check → agents:map:check → test
      - name: Verify
        run: pnpm verify

      - name: Build
        run: pnpm build

      - name: Bundle Size Check
        run: pnpm size:check

      # ── E2E 门禁（L4）：跑真实生产构建 + 真实 Chromium ──────────────────
      # 只检查 e2e/ 与 playwright.config.ts（pnpm lint 仍只覆盖 src）
      - name: E2E Typecheck
        run: pnpm typecheck:e2e

      - name: E2E Lint
        run: pnpm exec eslint e2e playwright.config.ts

      # --with-deps 安装 Chromium 及 Linux 系统依赖（runner 自带免密 sudo）
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # dist 已由 Build 步骤产出；test:e2e 缺构建会直接报错
      - name: E2E (Playwright)
        run: pnpm test:e2e

      # 失败证据：trace / screenshot / HTML 报告（retries=0，不存在重试掩盖）
      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
